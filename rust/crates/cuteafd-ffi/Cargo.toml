[package]
name = "cuteafd-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
libloading.workspace = true

[dev-dependencies]
# The chunk-1 device test compares the FFI-driven kernel against the production
# CPU sampler, which is the frozen correctness oracle
# (`cuteafd_core::TargetSamplingParams`). `cuteafd-core` does not depend on
# `cuteafd-ffi`, so this is not a dependency cycle, and it is test-only.
cuteafd-core = { path = "../cuteafd-core" }
